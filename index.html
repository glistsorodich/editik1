<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIL — ПРОВИНЦИЯ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; }
  body {
    font-family: 'Arial Black', sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  #photo {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 0.08s;
    z-index: 1;
    filter: contrast(1.4) saturate(1.2) brightness(0.9);
  }

  body.shake #photo { animation: shake 0.15s infinite; }
  @keyframes shake {
    0%   { transform: translate(0,0) scale(1.05); }
    25%  { transform: translate(-8px, 5px) scale(1.08); }
    50%  { transform: translate(7px, -6px) scale(1.06); }
    75%  { transform: translate(-5px, 8px) scale(1.09); }
    100% { transform: translate(0,0) scale(1.05); }
  }

  #flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    z-index: 5;
    pointer-events: none;
    transition: opacity 0.05s;
  }
  #flash.on { opacity: 0.8; }

  #glitch {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    opacity: 0;
    mix-blend-mode: screen;
  }
  #glitch.on {
    opacity: 1;
    background: linear-gradient(90deg, #f00, transparent, #0ff, transparent);
    animation: glitchMove 0.1s infinite;
  }
  @keyframes glitchMove {
    0%   { transform: translate(0,0); filter: hue-rotate(0deg); }
    50%  { transform: translate(-20px, 5px); filter: hue-rotate(180deg); }
    100% { transform: translate(0,0); filter: hue-rotate(360deg); }
  }

  #start-screen {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 20px;
  }
  #start-screen h1 {
    font-size: 48px;
    letter-spacing: 8px;
    color: #fff;
    text-shadow: 0 0 20px #f00, 0 0 40px #900;
    margin-bottom: 20px;
    animation: pulseTitle 1s infinite alternate;
  }
  @keyframes pulseTitle {
    from { transform: scale(1); text-shadow: 0 0 20px #f00; }
    to   { transform: scale(1.05); text-shadow: 0 0 40px #f00, 0 0 60px #900; }
  }
  #start-btn {
    font-size: 24px;
    padding: 22px 60px;
    background: #f00;
    color: #fff;
    border: 3px solid #fff;
    font-family: 'Arial Black', sans-serif;
    font-weight: bold;
    letter-spacing: 3px;
    cursor: pointer;
    box-shadow: 0 0 30px #f00, 0 0 60px #900;
    transition: transform 0.15s;
  }
  #start-btn:hover { transform: scale(1.05); }
  #start-btn:active { transform: scale(0.95); }

  #caption {
    position: fixed;
    bottom: 40px;
    left: 0; right: 0;
    text-align: center;
    font-size: 32px;
    color: #fff;
    text-shadow: 0 0 20px #f00, 0 0 40px #900;
    z-index: 3;
    opacity: 0;
    transition: opacity 0.2s;
    letter-spacing: 4px;
  }
  #caption.show { opacity: 1; }

  #final-screen {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 20;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  #final-screen.show { display: flex; }
  #final-screen h1 {
    font-size: 64px;
    color: #f00;
    text-shadow: 0 0 30px #f00, 0 0 60px #900;
    letter-spacing: 6px;
    animation: pulseTitle 0.8s infinite alternate;
  }
  #final-screen p {
    font-size: 28px;
    margin-top: 30px;
    letter-spacing: 3px;
    color: #fff;
  }
</style>
</head>
<body>

<div id="photo"></div>
<div id="glitch"></div>
<div id="flash"></div>
<div id="caption"></div>

<div id="start-screen">
  <h1>ZIL — ПРОВИНЦИЯ</h1>
  <button id="start-btn">▶ ВКЛЮЧИТЬ</button>
</div>

<div id="final-screen">
  <h1>ЖМИ ГАЗ</h1>
  <p>Для друна 🏍️</p>
</div>

<script>
  const photos = [
    "1.jpg",
    "2.jpg",
    "3.jpg",
    "4.jpg",
    "5.jpg",
    "6.jpg",
    "7.jpg",
    "8.jpg",
    "9.jpg",
    "10.jpg",
    "11.jpg",
    "12.jpg",
    "13.jpg",
    "14.jpg",
    "15.jpg",
    "16.jpg"
  ];

  const song = "song.mp3";

  const photoTime = 400;

  const captions = [
    "ПРОВИНЦИЯ", "ZIL", "ЖМИ ГАЗ", "БРАТ", "ДВИЖ"
  ];

  const photoDiv = document.getElementById("photo");
  const flash = document.getElementById("flash");
  const glitch = document.getElementById("glitch");
  const caption = document.getElementById("caption");
  const startScreen = document.getElementById("start-screen");
  const finalScreen = document.getElementById("final-screen");
  const startBtn = document.getElementById("start-btn");

  let currentPhoto = 0;

  photos.forEach(src => {
    const img = new Image();
    img.src = src;
  });

  function showNextPhoto() {
    if (currentPhoto >= photos.length) {
      photoDiv.style.opacity = "0";
      finalScreen.classList.add("show");
      return;
    }

    photoDiv.style.backgroundImage = `url("${photos[currentPhoto]}")`;
    photoDiv.style.opacity = "1";

    if (currentPhoto % 3 === 0) {
      caption.innerText = captions[Math.floor(Math.random() * captions.length)];
      caption.classList.add("show");
      setTimeout(() => caption.classList.remove("show"), photoTime - 100);
    }

    if (currentPhoto % 3 === 0) {
      flash.classList.add("on");
      setTimeout(() => flash.classList.remove("on"), 80);
    }

    if (currentPhoto % 2 === 0) {
      document.body.classList.add("shake");
      setTimeout(() => document.body.classList.remove("shake"), photoTime - 50);
    }

    if (currentPhoto % 4 === 0) {
      glitch.classList.add("on");
      setTimeout(() => glitch.classList.remove("on"), 100);
    }

    currentPhoto++;
    setTimeout(showNextPhoto, photoTime);
  }

  startBtn.addEventListener("click", async () => {
    // фуллскрин
    try {
      await document.documentElement.requestFullscreen();
    } catch(e) {}

    startScreen.style.display = "none";

    const audio = new Audio(song);
    audio.volume = 1.0;
    audio.play().catch(e => console.log("Аудио:", e));

    setTimeout(showNextPhoto, 500);
  });
</script>
</body>
</html>
